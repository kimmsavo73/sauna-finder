<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saunaan</title>
<meta name="description" content="Find public saunas near you, wherever you travel.">
<meta name="theme-color" content="#1f4d3a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><path d="M9 6c-2 3 2 4 0 7M16 4c-2 3 2 4 0 7M23 6c-2 3 2 4 0 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M4 18h24v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z" fill="currentColor"/></svg>
      <h1>Saunaan</h1>
    </div>
    <form id="searchForm" class="search" role="search">
      <label for="q" class="sr">Search a city or place</label>
      <input id="q" name="q" type="search" placeholder="City, address or place" autocomplete="off" enterkeyhint="search">
      <button type="submit" class="btn ghost" aria-label="Search">Go</button>
    </form>
    <div class="controls">
      <button id="locateBtn" type="button" class="btn primary">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        Near me
      </button>
      <div class="chips" role="radiogroup" aria-label="Search radius">
        <button type="button" class="chip" data-r="2000" role="radio">2 km</button>
        <button type="button" class="chip" data-r="5000" role="radio">5 km</button>
        <button type="button" class="chip" data-r="15000" role="radio">15 km</button>
        <button type="button" class="chip" data-r="40000" role="radio">40 km</button>
      </div>
    </div>
  </header>

  <div class="mapwrap">
    <div id="map" aria-label="Map of saunas"></div>
    <button id="areaBtn" type="button" class="btn float" hidden>Search this area</button>
  </div>

  <section class="sheet" aria-live="polite">
    <div class="sheethead">
      <p id="status" class="status">Tap <b>Near me</b> or search a place to find saunas.</p>
      <div class="filters">
        <label class="toggle"><input id="openOnly" type="checkbox"> Open now</label>
        <label class="toggle"><input id="showUnverified" type="checkbox"> Include unverified</label>
      </div>
    </div>
    <ol id="list" class="list"></ol>
    <footer class="foot">
      Data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors, via Overpass. Hours and “open now” come from what volunteers have mapped, so check the venue’s site before you go. Missing a sauna? <a href="https://www.openstreetmap.org/" target="_blank" rel="noopener">Add it to OpenStreetMap</a> and it appears here.
    </footer>
  </section>
</div>

<template id="itemTpl">
  <li class="item">
    <button type="button" class="itemmain">
      <span class="dot" aria-hidden="true"></span>
      <span class="itembody">
        <span class="name"></span>
        <span class="meta"></span>
        <span class="hours"></span>
      </span>
      <span class="dist"></span>
    </button>
    <div class="details" hidden>
      <dl class="facts"></dl>
      <div class="actions">
        <a class="btn primary go" target="_blank" rel="noopener">Directions</a>
        <a class="btn ghost apple" target="_blank" rel="noopener">Apple Maps</a>
        <a class="btn ghost web" target="_blank" rel="noopener" hidden>Website</a>
        <a class="btn ghost tel" hidden>Call</a>
        <a class="btn ghost osm" target="_blank" rel="noopener">OSM</a>
      </div>
    </div>
  </li>
</template>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="hours.js"></script>
<script src="app.js"></script>
</body>
</html>
